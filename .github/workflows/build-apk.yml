name: StagePulse Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: StagePulse validation and Android build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Validate project
        shell: bash
        run: |
          set -euo pipefail
          test -d apps
          test -f settings.gradle
          test -f build.gradle
          test -f apps/build.gradle
          test -f apps/src/main/AndroidManifest.xml
          test -f apps/src/main/java/tr/stagepulse/tools/MainActivity.java
          test -f apps/src/main/java/tr/stagepulse/tools/Acoustics.java
          test -f apps/src/test/java/tr/stagepulse/tools/AcousticsTest.java

      - name: Validate GLB library
        shell: bash
        run: |
          python3 - <<'PY'
          import struct
          from pathlib import Path
          root = Path('apps/src/main/assets/models')
          files = sorted(root.glob('*.glb'))
          assert len(files) >= 35, f'Expected >=35 GLB assets, found {len(files)}'
          for path in files:
              data = path.read_bytes()
              assert len(data) >= 20, path
              magic, version, total = struct.unpack_from('<III', data, 0)
              assert magic == 0x46546C67 and version == 2 and total == len(data), path
              pos = 12; json_seen = False
              while pos + 8 <= len(data):
                  length, kind = struct.unpack_from('<II', data, pos)
                  pos += 8
                  assert pos + length <= len(data), path
                  if kind == 0x4E4F534A:
                      json_seen = True
                  pos += length
              assert json_seen, path
          print(f'Validated {len(files)} GLB files.')
          PY

      - name: Unit tests
        run: gradle test --no-daemon --stacktrace --warning-mode all

      - name: Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: Release APK
        run: gradle assembleRelease --no-daemon --stacktrace --warning-mode all

      - name: Release AAB
        run: gradle bundleRelease --no-daemon --stacktrace --warning-mode all

      - name: Verify artifacts
        shell: bash
        run: |
          set -euo pipefail
          debug=$(find apps/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)
          release=$(find apps/build/outputs/apk/release -type f -name '*.apk' | head -n 1)
          aab=$(find apps/build/outputs/bundle/release -type f -name '*.aab' | head -n 1)
          test -n "$debug" && test -s "$debug"
          test -n "$release" && test -s "$release"
          test -n "$aab" && test -s "$aab"
          echo "DEBUG APK: $debug"; ls -lh "$debug"
          echo "RELEASE APK: $release"; ls -lh "$release"
          echo "RELEASE AAB: $aab"; ls -lh "$aab"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StagePulse-Android-build
          path: |
            apps/build/outputs/apk/debug/*.apk
            apps/build/outputs/apk/release/*.apk
            apps/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StagePulse-build-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14
