name: StagePulse System Design APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7'

      - name: Validate project layout
        run: |
          test -d apps
          test -f settings.gradle
          test -f build.gradle
          test -f apps/build.gradle
          test -f apps/src/main/AndroidManifest.xml
          test -f apps/src/main/java/tr/stagepulse/tools/MainActivity.java
          test -f apps/src/main/java/tr/stagepulse/tools/Acoustics.java
          test -f apps/src/test/java/tr/stagepulse/tools/AcousticsTest.java

      - name: Validate 3D model library
        shell: bash
        run: |
          set -e
          models=(
            linearray4 linearray8 sub_double18 sub_single18 monitor12 monitor15
            drumkit guitar bass keyboard kanun baglama ud violin cello darbuka ney
            clarinet sax trumpet trombone accordion percussion iem truss movinghead
            console laptop micstand speakerstand ledwall riser barrier pc stage
          )
          python3 - <<'PYCODE'
          import glob, struct, sys
          required = [
              "linearray4","linearray8","sub_double18","sub_single18","monitor12","monitor15",
              "drumkit","guitar","bass","keyboard","kanun","baglama","ud","violin","cello","darbuka","ney",
              "clarinet","sax","trumpet","trombone","accordion","percussion","iem","truss","movinghead",
              "console","laptop","micstand","speakerstand","ledwall","riser","barrier","pc","stage"
          ]
          for name in required:
              path = f"apps/src/main/assets/models/{name}.glb"
              data = open(path, "rb").read()
              assert len(data) >= 20, path
              magic, version, total = struct.unpack_from("<III", data, 0)
              assert magic == 0x46546C67 and version == 2 and total == len(data), path
              pos = 12
              json_seen = False
              bin_seen = False
              while pos + 8 <= len(data):
                  length, kind = struct.unpack_from("<II", data, pos)
                  pos += 8
                  chunk = data[pos:pos+length]
                  assert len(chunk) == length, path
                  if kind == 0x4E4F534A:
                      json_seen = True
                  if kind == 0x004E4942:
                      bin_seen = True
                  pos += length
              assert json_seen and bin_seen, path
          print("All required GLB assets are structurally valid GLB v2 files.")
          PYCODE

      - name: Unit tests
        run: gradle test --no-daemon --stacktrace

      - name: Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK=$(find apps/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          test -s "$APK"
          echo "APK=$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StagePulse-System-Design-debug
          path: apps/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StagePulse-build-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14
