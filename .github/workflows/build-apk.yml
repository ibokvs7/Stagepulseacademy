name: StagePulse Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build StagePulse APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify project structure
        shell: bash
        run: |
          set -e

          echo "Checking StagePulse project..."

          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties
          test -f apps/build.gradle
          test -f apps/src/main/AndroidManifest.xml
          test -f apps/src/main/java/tr/stagepulse/tools/MainActivity.java

          echo "Project structure OK."

      - name: Verify Gradle Wrapper
        shell: bash
        run: |
          set -e

          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties

          chmod +x gradlew

          echo "Gradle Wrapper OK."

      - name: Show Gradle version
        shell: bash
        run: |
          ./gradlew --version

      - name: Run unit tests
        shell: bash
        run: |
          ./gradlew test \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Build debug APK
        shell: bash
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Verify generated APK
        shell: bash
        run: |
          set -e

          APK="apps/build/outputs/apk/debug/apps-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            echo "Searching build outputs..."
            find apps/build -type f 2>/dev/null || true
            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK exists but is empty."
            exit 1
          fi

          echo "APK successfully generated."
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StagePulse-debug-apk
          path: apps/build/outputs/apk/debug/apps-debug.apk
          if-no-files-found: error
